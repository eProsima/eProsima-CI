name: 'install_colcon'
description: 'Install colcon'

inputs:

  mixins:
    description: 'Whether to register the default colcon mixin repository'
    required: false
    default: 'false'

runs:
  using: composite
  steps:

    - name: Install colcon
      uses: eProsima/eProsima-CI/macos/install_python_packages@v0.50.0
      with:
        packages: 'setuptools==74.1.3 colcon-common-extensions colcon-mixin'
        upgrade: true

    - name: Download default colcon mixin
      if: ${{ inputs.mixins == 'true' }}
      shell: bash
      run: |
        colcon mixin add default https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml
        colcon mixin update default
