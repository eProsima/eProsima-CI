name: 'install_colcon'
description: 'Install colcon'

inputs:

  path:
    description: 'Path to virtual environment'
    required: false
    default: '.venv'

  mixins:
    description: 'Whether to register the default colcon mixin repository'
    required: false
    default: 'false'

runs:
  using: composite
  steps:

    - name: Install colcon
      uses: eProsima/eProsima-CI/ubuntu/install_python_packages@main
      with:
        packages: 'setuptools==74.1.3 colcon-common-extensions colcon-mixin'
        path: ${{ inputs.path }}
        upgrade: true

    - name: Download default colcon mixin
      if: ${{ inputs.mixins == 'true' }}
      shell: bash
      run: colcon mixin add default https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml; colcon mixin update default

    - name: Remove undesired subpackages
      shell: bash
      run: |
        python3 -m pip uninstall -y colcon-powershell
